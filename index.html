<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ddd8cf" />
    <meta
      name="description"
      content="A sports car assembles itself as you scroll: chassis, V8, body panels, glass and wheels, built in order on a workshop floor."
    />
    <title>Assembly — A Sports Car, Built One Part at a Time</title>
  </head>
  <body>
    <!-- Static copy of LoadingScreen (src/components/ui/LoadingScreen.tsx), so the
         first paint is the loader rather than a blank page while the entry
         chunk downloads. React replaces it with the live one, same pixels. -->
    <div id="root">
      <div class="fixed inset-0 z-40 flex flex-col items-center justify-center bg-[var(--garage-wall)]">
        <p class="text-3xl font-semibold tracking-tight text-stone-800">Assembly</p>
        <p class="mt-2 font-mono text-[0.65rem] tracking-[0.3em] text-stone-600 uppercase">Preparing the bay</p>
        <div class="mt-8 h-px w-56 overflow-hidden bg-stone-400/70">
          <div class="h-full origin-left bg-stone-800" style="transform: scaleX(0.04)"></div>
        </div>
        <p class="mt-3 font-mono text-[0.65rem] tracking-[0.2em] text-stone-600 tabular-nums">0%</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
